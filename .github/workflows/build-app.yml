name: Build App Artifact

# Builds an unsigned Debug .app on a macOS runner and uploads it as an artifact.
# Intended for testing branches without a local Xcode installation.

on:
  workflow_dispatch:
  pull_request:
    branches: [ gigaam-stable ]
  push:
    branches: [ feat/gigaam-v3, gigaam-stable ]

jobs:
  build-app:
    name: Build unsigned FluidVoice.app
    # Use Intel runner capacity and cross-build arm64 for a generic Mac.
    runs-on: macos-26-intel
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Test original-field dictation and manual recovery
      run: python3 Tests/run_original_dictation_target_tests.py

    - name: Build (unsigned)
      run: |
        set -o pipefail
        xcodebuild \
          -project Fluid.xcodeproj \
          -scheme Fluid \
          -configuration Debug \
          -destination 'generic/platform=macOS' \
          -derivedDataPath DerivedData \
          -disablePackageRepositoryCache \
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/FluidVoiceSourcePackages" \
          -onlyUsePackageVersionsFromResolvedFile \
          build \
          ARCHS=arm64 \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Zip app bundle
      run: |
        APP_PATH="$(find DerivedData/Build/Products/Debug -maxdepth 1 -name '*.app' | head -1)"
        test -n "$APP_PATH"
        APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
        lipo -verify_arch arm64 "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE"
        ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" FluidVoice-Debug.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluidVoice-Debug
        path: FluidVoice-Debug.zip
        retention-days: 7
